<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSOR DROP - Симулятор Кейсов</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; user-select: none; }
        body { background: #12131a; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Шапка с балансом */
        .header { display: flex; justify-content: space-between; width: 100%; max-width: 800px; background: #1a1c24; padding: 15px 20px; border-radius: 10px; border: 1px solid #2d313f; margin-bottom: 20px; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #ff3e3e; text-shadow: 0 0 10px rgba(255,62,62,0.3); }
        .balance { font-size: 20px; font-weight: bold; color: #ffd700; }

        /* Игровая зона */
        .main-container { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 800px; }
        
        /* Кнопка-Кликер */
        .clicker-box { background: #1a1c24; border: 1px solid #2d313f; border-radius: 10px; padding: 20px; text-align: center; }
        .click-btn { background: linear-gradient(135deg, #2b3040, #1e222e); border: 2px solid #3b4256; color: #fff; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.1s; width: 100%; max-width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .click-btn:active { transform: scale(0.96); background: #222634; }

        /* Выбор Кейсов */
        .cases-section { background: #1a1c24; border: 1px solid #2d313f; border-radius: 10px; padding: 20px; }
        .section-title { font-size: 18px; margin-bottom: 15px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .case-card { background: #222530; border: 1px solid #323746; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.2s; }
        .case-card:hover { border-color: #ff3e3e; transform: translateY(-2px); }
        .case-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .case-price { color: #ffd700; font-weight: bold; font-size: 14px; }

        /* РУЛЕТКА (Анимация открытия) */
        .roulette-wrapper { background: #1a1c24; border: 1px solid #2d313f; border-radius: 10px; padding: 25px 20px; position: relative; overflow: hidden; display: none; }
        .roulette-container { position: relative; width: 100%; height: 130px; overflow: hidden; background: #0f1015; border-radius: 6px; border: 1px solid #252833; }
        .roulette-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #ff3e3e; z-index: 10; transform: translateX(-20%); box-shadow: 0 0 10px #ff3e3e; }
        .roulette-track { display: flex; position: absolute; left: 0; top: 10px; height: 110px; transition: transform 4s cubic-bezier(0.1, 0.6, 0.1, 1); will-change: transform; }
        
        /* Элементы внутри рулетки */
        .skin-card { width: 110px; height: 110px; background: #1c1e24; margin-right: 6px; flex-shrink: 0; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 5px; font-size: 11px; border-bottom: 4px solid #fff; font-weight: bold; }
        .skin-img { font-size: 32px; margin-bottom: 5px; }
        .skin-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 12px; height: 24px; color: #e1e1e1; }

        /* Редкости скинов */
        .rarity-consumer { border-bottom-color: #b0c3d9; }
        .rarity-milspec { border-bottom-color: #4b69ff; }
        .rarity-classified { border-bottom-color: #d32ce6; }
        .rarity-covert { border-bottom-color: #eb4b4b; }
        .rarity-gold { border-bottom-color: #e4ae39; }

        /* Кнопки управления кейсом */
        .roulette-controls { display: flex; justify-content: center; margin-top: 15px; }
        
        /* ИНВЕНТАРЬ */
        .inventory-section { background: #1a1c24; border: 1px solid #2d313f; border-radius: 10px; padding: 20px; min-height: 150px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .inv-card { background: #222530; border-radius: 6px; padding: 10px; text-align: center; font-size: 11px; position: relative; border-bottom: 3px solid #fff; cursor: pointer; transition: 0.1s; }
        .inv-card:hover { transform: scale(1.03); background: #292d3b; }
        .inv-card .sell-price { color: #ffd700; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Шапка игры -->
    <div class="header">
        <div class="logo">🗑️ MUSOR DROP</div>
        <div class="balance">Баланс: <span id="balance-val">100</span> 🪙</div>
    </div>

    <div class="main-container">
        <!-- Фарм валюты (Кликер) -->
        <div class="clicker-box">
            <button class="click-btn" id="clicker-btn">ПОШУРШАТЬ В БАКЕ (+5 🪙)</button>
        </div>

        <!-- Рулетка (Скрыта, пока не откроют кейс) -->
        <div class="roulette-wrapper" id="roulette-block">
            <div class="section-title" id="current-case-title">Открытие кейса</div>
            <div class="roulette-container">
                <div class="roulette-line"></div>
                <div class="roulette-track" id="roulette-track"></div>
            </div>
            <div class="roulette-controls">
                <button class="click-btn" id="close-roulette-btn" style="display:none; background:#aa2222; border-color:#cc3333;">ЗАКРЫТЬ</button>
            </div>
        </div>

        <!-- Список кейсов -->
        <div class="cases-section">
            <div class="section-title">Доступные Мусорки</div>
            <div class="cases-grid" id="cases-grid"></div>
        </div>

        <!-- Инвентарь игрока -->
        <div class="inventory-section">
            <div class="section-title">Ваш инвентарь (Клик для продажи)</div>
            <div class="inventory-grid" id="inventory-grid"></div>
        </div>
    </div>
    <script>
    // Массив всех предметов, которые могут выпасть
    const SKINS_DB = [
        // Ширпотреб (Consumer)
        { id: 1, name: 'Сломанная бутылка', emoji: '🍾', price: 2, rarity: 'consumer' },
        { id: 2, name: 'Ржавая консервная банка', emoji: '🥫', price: 5, rarity: 'consumer' },
        { id: 3, name: 'Старый носок', emoji: '🧦', price: 8, rarity: 'consumer' },
        
        // Армейское качество (Mil-spec)
        { id: 4, name: 'Поношенный Глок | Газета', emoji: '🔫', price: 25, rarity: 'milspec' },
        { id: 5, name: 'USP-S | Картон', emoji: '🔫', price: 40, rarity: 'milspec' },
        { id: 6, name: 'Дигл | Плесневелый сыр', emoji: '🔫', price: 65, rarity: 'milspec' },
        
        // Засекреченное (Classified)
        { id: 7, name: 'AK-47 | Изолента', emoji: '💥', price: 150, rarity: 'classified' },
        { id: 8, name: 'M4A4 | Ржавый гвоздь', emoji: '💥', price: 210, rarity: 'classified' },
        
        // Тайное (Covert)
        { id: 9, name: 'AWP | Свалка радиоактивных отходов', emoji: '🦖', price: 650, rarity: 'covert' },
        { id: 10, name: 'M4A1-S | Золотая кожура', emoji: '🍌', price: 800, rarity: 'covert' },
        
        // Особо редкое (Gold)
        { id: 11, name: 'Керамбит | Ржавый кусок арматуры', emoji: '🔪', price: 2500, rarity: 'gold' },
        { id: 12, name: 'Мотоциклетные перчатки | Грязные тряпки', emoji: '🧤', price: 1800, rarity: 'gold' }
    ];

    // Настройки кейсов
    const CASES = [
        {
            id: 'eco_bin',
            name: 'Обычный бак',
            price: 30,
            // Доступные ID предметов в этом кейсе
            items: [1, 2, 3, 4, 5]
        },
        {
            id: 'elite_dumpster',
            name: 'Элитная помойка',
            price: 150,
            items: [4, 5, 6, 7, 8]
        },
        {
            id: 'secret_landfill',
            name: 'Тайный полигон',
            price: 500,
            items: [7, 8, 9, 10, 11, 12]
        }
    ];

    // Глобальное состояние игры
    let balance = 100;
    let inventory = [];
    let isRolling = false;

    // DOM Элементы
    const balanceVal = document.getElementById('balance-val');
    const clickerBtn = document.getElementById('clicker-btn');
    const casesGrid = document.getElementById('cases-grid');
    const inventoryGrid = document.getElementById('inventory-grid');
    const rouletteBlock = document.getElementById('roulette-block');
    const rouletteTrack = document.getElementById('roulette-track');
    const closeRouletteBtn = document.getElementById('close-roulette-btn');
    const currentCaseTitle = document.getElementById('current-case-title');

    // Инициализация интерфейса
    function init() {
        updateBalanceDisplay();
        renderCases();
        renderInventory();
    }

    // Обновление баланса на экране
    function updateBalanceDisplay() {
        balanceVal.textContent = balance;
    }

    // Клик по тапалке
    clickerBtn.addEventListener('click', () => {
        if (isRolling) return; // Нельзя тапать во время прокрутки рулетки
        balance += 5;
        updateBalanceDisplay();
        
        // Небольшой визуальный эффект клика
        clickerBtn.style.transform = 'scale(0.98)';
        setTimeout(() => clickerBtn.style.transform = 'none', 50);
    });

    // Отрисовка списка доступных кейсов
    function renderCases() {
        casesGrid.innerHTML = '';
        CASES.forEach(c => {
            const card = document.createElement('div');
            card.className = 'case-card';
            card.innerHTML = `
                <div style="font-size: 40px; margin-bottom: 10px;">🗑️</div>
                <div class="case-name">${c.name}</div>
                <div class="case-price">${c.price} 🪙</div>
            `;
            card.addEventListener('click', () => openCase(c.id));
            casesGrid.appendChild(card);
        });
    }
    // Отрисовка инвентаря игрока
    function renderInventory() {
        inventoryGrid.innerHTML = '';
        if (inventory.length === 0) {
            inventoryGrid.innerHTML = '<div style="color: #666; font-style: italic; grid-column: 1/-1;">Здесь будут ваши скины...</div>';
            return;
        }
        
        inventory.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `inv-card rarity-${item.rarity}`;
            card.innerHTML = `
                <div style="font-size: 24px; margin-bottom: 5px;">${item.emoji}</div>
                <div style="font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.name}</div>
                <div class="sell-price">+${item.price} 🪙</div>
            `;
            // Продажа предмета при клике
            card.addEventListener('click', () => sellItem(index));
            inventoryGrid.appendChild(card);
        });
    }

    // Логика продажи предмета
    function sellItem(index) {
        if (isRolling) return; // Нельзя продавать во время анимации рулетки
        const item = inventory[index];
        balance += item.price;
        inventory.splice(index, 1);
        updateBalanceDisplay();
        renderInventory();
    }

    // Запуск процесса открытия кейса
    function openCase(caseId) {
        if (isRolling) return;
        
        const targetCase = CASES.find(c => c.id === caseId);
        if (!targetCase) return;

        // Проверка баланса
        if (balance < targetCase.price) {
            alert('Недостаточно монет! Пошуршите в баке 🪙');
            return;
        }

        // Списываем стоимость кейса
        balance -= targetCase.price;
        updateBalanceDisplay();
        isRolling = true;

        // Показываем блок рулетки и прячем кнопку закрытия
        rouletteBlock.style.display = 'block';
        closeRouletteBtn.style.display = 'none';
        currentCaseTitle.textContent = `Открытие: ${targetCase.name}`;

        // Генерируем массив предметов для ленты рулетки (всего около 30 штук для иллюзии прокрутки)
        const totalItemsInTrack = 30;
        const trackItems = [];
        
        // Заполняем ленту случайными предметами, доступными в этом кейсе
        for (let i = 0; i < totalItemsInTrack; i++) {
            const randomSkinId = targetCase.items[Math.floor(Math.random() * targetCase.items.length)];
            const skin = SKINS_DB.find(s => s.id === randomSkinId);
            trackItems.push(skin);
        }

        // Предмет на 26-й позиции станет финальным выигрышем
        const winningIndex = 25; 
        const winningSkin = trackItems[winningIndex];

        // Очищаем и строим трек рулетки визуально
        rouletteTrack.innerHTML = '';
        rouletteTrack.style.transition = 'none';
        rouletteTrack.style.transform = 'translateX(0px)';

        trackItems.forEach(item => {
            const el = document.createElement('div');
            el.className = `skin-card rarity-${item.rarity}`;
            el.innerHTML = `
                <div class="skin-img">${item.emoji}</div>
                <div class="skin-title">${item.name}</div>
            `;
            rouletteTrack.appendChild(el);
        });

        // Форсируем перерисовку браузером, чтобы сбросить анимацию
        rouletteTrack.offsetHeight;

        // Вычисляем точную позицию смещения (ширина карточки 110px + отступ 6px)
        const cardWidth = 116; 
        // Центрируем выигрышную карточку относительно красной линии (середины контейнера рулетки)
        const containerWidth = rouletteBlock.querySelector('.roulette-container').offsetWidth;
        const targetShift = (winningIndex * cardWidth) - (containerWidth / 2) + (cardWidth / 2);

        // Запускаем плавную анимацию прокрутки
        rouletteTrack.style.transition = 'transform 4s cubic-bezier(0.1, 0.6, 0.1, 1)';
        rouletteTrack.style.transform = `translateX(-${targetShift}px)`;

        // Обработка окончания анимации
        setTimeout(() => {
            // Добавляем выигранный предмет в инвентарь
            inventory.push(winningSkin);
            renderInventory();
            
            // Показываем кнопку закрытия рулетки
            closeRouletteBtn.style.display = 'block';
            isRolling = false;
        }, 4000);
    }

    // Кнопка закрытия окна рулетки
    closeRouletteBtn.addEventListener('click', () => {
        rouletteBlock.style.display = 'none';
    });

    // Запуск инициализации при загрузке страницы
    init();
</script>
</body>
</html>
